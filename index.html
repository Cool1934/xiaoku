<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>即构语聊房 · 15麦位</title>
<script src="https://unpkg.com/zego-express-engine-webrtc@latest/index.js"></script>
<script src="https://unpkg.com/zego-zim-web@latest/index.js"></script>
<style>
  :root{--main:#4f46e5;--on:#22c55e;--off:#64748b;--bg:#0f172a;--card:#1e293b;--txt:#e2e8f0}
  *{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--txt)}
  .wrap{max-width:1100px;margin:0 auto;padding:16px}
  h1{font-size:22px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 4px 14px #0003}
  label{font-size:12px;color:#94a3b8;display:block;margin:8px 0 4px}
  input{width:100%;padding:9px 11px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:var(--txt);font-size:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row>div{flex:1 1 160px}
  button{background:var(--main);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:14px;cursor:pointer;font-weight:600}
  button:hover{filter:brightness(1.1)}button.ghost{background:#334155}
  .seats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .seat{background:#0f172a;border:1px solid #334155;border-radius:10px;padding:12px 6px;text-align:center;cursor:pointer;transition:.15s;position:relative;min-height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
  .seat:hover{border-color:var(--main)}.seat.on{border-color:var(--on);background:#052e1a}
  .seat .dot{width:9px;height:9px;border-radius:50%;background:var(--off);display:inline-block}
  .seat.on .dot{background:var(--on);box-shadow:0 0 8px var(--on)}
  .seat .name{font-size:12px;word-break:break-all;line-height:1.2}
  .seat .idx{font-size:11px;color:#94a3b8}
  .info{font-size:13px;color:#cbd5e1;line-height:1.8}
  .info b{color:#fff}.log{font-size:12px;color:#94a3b8;max-height:120px;overflow:auto;background:#0b1224;border-radius:8px;padding:8px}
  .hidden{display:none}.tag{font-size:11px;background:#334155;padding:2px 8px;border-radius:99px;color:#e2e8f0}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎙️ 即构语聊房 <span class="tag">15 麦位</span></h1>

  <div id="setup" class="card">
    <div class="row">
      <div><label>用户ID</label><input id="iUid" placeholder="如 u1"></div>
      <div><label>昵称</label><input id="iName" placeholder="如 小明"></div>
      <div><label>房间ID</label><input id="iRoom" placeholder="如 room1"></div>
    </div>
    <label>Worker 地址（部署后填，如 https://zego-token.xxx.workers.dev）</label>
    <input id="iApi" placeholder="https://zego-token.<你的子域>.workers.dev">
    <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap">
      <button id="btnJoin">加入房间</button>
      <button id="btnLeave" class="ghost hidden">离开房间</button>
    </div>
    <div id="log" class="log" style="margin-top:12px"></div>
  </div>

  <div id="room" class="card hidden">
    <div class="info">
      房间 <b id="rId">-</b> ｜ 房主 <b id="rOwner">-</b> ｜ 麦位 <b id="rSeat">0/15</b>
    </div>
    <div class="seats" id="seats"></div>
    <div style="margin-top:12px;color:#94a3b8;font-size:12px">点空麦位上麦，点自己已占麦位下麦。两个标签用不同用户ID进同一房间即可互听。</div>
  </div>
</div>

<script>
// ============ 配置区（已为你填好） ============
const APP_ID = 1183388233;                       // 即构 AppID（已填）
const RTC_SERVER = "wss://rtc.zego.im";          // Express WebRTC 接入域名（已填）
const ZIM_SERVER = "wss://accesshub-wss.zego.im"; // ZIM 接入域名（已填）
// ==============================================

const TOTAL = 15;
const $ = (id)=>document.getElementById(id);
const log=(m)=>{const d=new Date().toLocaleTimeString();$('log').innerHTML+=`<div>[${d}] ${m}</div>`;};

let zg, zim, token, uid, uname, roomId, mySeat=-1, localStream=null;

// 初始化 15 个麦位 UI
function buildSeats(){
  const box=$('seats');box.innerHTML='';
  for(let i=0;i<TOTAL;i++){const s=document.createElement('div');s.className='seat';s.dataset.i=i;
    s.innerHTML=`<span class="dot"></span><span class="idx">麦位 ${i}</span><span class="name"></span>`;
    s.onclick=()=>onSeatClick(i);box.appendChild(s);
  }
}
function setSeat(i,{on=false,name=''} ){const s=$('seats').children[i];if(!s)return;
  s.classList.toggle('on',on);s.querySelector('.name').textContent=name;}
function refreshSeatCount(){let n=0;for(const c of $('seats').children)if(c.classList.contains('on'))n++;
  $('rSeat').textContent=`${n}/${TOTAL}`;}

// 获取 token（调 Worker）
async function getToken(userId,rid){
  const api=($('iApi').value||'').trim().replace(/\/$/,'');if(!api)throw new Error('请先填 Worker 地址');
  const r=await fetch(api+'/api/token',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({userId,roomId:rid})});
  if(!r.ok)throw new Error('Worker 返回 '+r.status);return r.json();
}

// 上/下麦
async function onSeatClick(i){
  if(mySeat===-1){ // 尝试上麦
    const key='seat'+i, attr={};attr[key]=JSON.stringify({uid,uname});
    try{await zim.setRoomAttributes(attr,roomId,{isForce:false});
      log(`抢到麦位 ${i}，开始推流`);await publish(i);
    }catch(e){log('上麦失败：'+e.message);}
  }else if(mySeat===i){ // 下麦
    await unpublish();try{await zim.deleteRoomAttributes(['seat'+i],roomId,{isForce:false});}catch(e){}
    log(`离开麦位 ${i}`);mySeat=-1;
  }
}

async function publish(seatIdx){
  const streamID=`room_${roomId}_seat${seatIdx}_${uid}`;
  localStream=await zg.createStream({audio:true});const a=document.createElement('audio');a.autoplay=true;a.muted=true;
  a.srcObject=localStream;document.body.appendChild(a);
  await zg.startPublishingStream(streamID,localStream);mySeat=seatIdx;
}

async function unpublish(){if(!localStream)return;
  const streamID=`room_${roomId}_seat${mySeat}_${uid}`;
  zg.stopPublishingStream(streamID);zg.destroyStream(localStream);localStream=null;
}

// 监听 ZIM 麦位属性变更
function bindZim(){
  zim.on('roomAttributesUpdated',(zim,data)=>{
    for(const inf of (data.infos||[])){if(!inf.attributes)continue;
      for(const k of Object.keys(inf.attributes)){if(k==='roominfo')continue;
        const idx=+k.replace('seat','');if(Number.isNaN(idx))continue;
        const v=inf.attributes[k];if(v===''||v==null){setSeat(idx,{on:false,name:''});}
        else{try{const o=JSON.parse(v);setSeat(idx,{on:true,name:o.uname||o.uid});}catch(_){}}
      }
    }refreshSeatCount();
  });
  zim.on('roomAttributesBatchUpdated',(...a)=>bindZim()); // 兼容
}

// 拉他人流
function bindRTC(){zg.on('roomStreamUpdate',(_,type,list)=>{for(const s of list){
  if(type==='ADD'){const el=document.createElement('audio');el.autoplay=true;el.controls=false;
    zg.startPlayingStream(s.streamID,el).then(()=>{document.body.appendChild(el);});}
  else zg.stopPlayingStream(s.streamID);}});
}

$('btnJoin').onclick=async()=>{try{
  uid=($('iUid').value||'').trim();uname=($('iName').value||'').trim();roomId=($('iRoom').value||'').trim();
  if(!uid||!uname||!roomId)return alert('请填齐用户ID/昵称/房间ID');
  log('请求 Token...');const r=await getToken(uid,roomId);token=r.token;
  log('初始化 SDK...');zg=new ZegoExpressEngine(APP_ID,RTC_SERVER);
  bindRTC();await zg.loginRoom(roomId,token,{userID:uid,userName:uname});
  zim=ZIM.create({appID:APP_ID,server:ZIM_SERVER});await zim.login({userID:uid,userName:uname},token);
  try{await zim.createRoom({roomID:roomId,roomName:'语聊房-'+roomId},{roomAttributes:{roominfo:JSON.stringify({owner:uid,name:'语聊房'})},roomDestroyDelayTime:30});}
  catch(_){}await zim.enterRoom(roomId);bindZim();
  $('rId').textContent=roomId;$('rOwner').textContent=uid;$('setup').classList.add('hidden');$('room').classList.remove('hidden');$('btnLeave').classList.remove('hidden');
  log('进入房间 '+roomId);buildSeats();refreshSeatCount();
}catch(e){log('加入失败：'+e.message);alert('加入失败：'+e.message);}};

$('btnLeave').onclick=async()=>{await unpublish();try{zg&&zg.logoutRoom(roomId);zim&&zim.leaveRoom(roomId);}catch(_){}
  $('room').classList.add('hidden');$('setup').classList.remove('hidden');$('btnLeave').classList.add('hidden');log('已离开');};
</script>
</body>
</html>
