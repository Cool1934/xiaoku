<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>即构语聊房</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #0f1420; color: #e6e9f2; min-height: 100vh; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 22px; margin-bottom: 6px; }
  .sub { color: #8a90a2; font-size: 13px; margin-bottom: 20px; }
  .card { background: #171c2c; border-radius: 14px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,.25); margin-bottom: 18px; }
  label { display: block; font-size: 13px; color: #aab; margin-bottom: 6px; }
  input { width: 100%; padding: 11px 12px; border-radius: 9px; border: 1px solid #2a3045; background: #11161f; color: #e6e9f2; font-size: 15px; outline: none; }
  input:focus { border-color: #4f6bff; }
  .row { display: flex; gap: 10px; align-items: flex-end; }
  .row .grow { flex: 1; }
  button { cursor: pointer; border: none; border-radius: 9px; padding: 11px 16px; font-size: 15px; font-weight: 600; }
  .btn-primary { background: #4f6bff; color: #fff; }
  .btn-primary:disabled { background: #35406b; cursor: not-allowed; }
  .btn-ghost { background: #232a40; color: #cfd5ea; }
  .btn-block { width: 100%; margin-top: 12px; }
  .hint { font-size: 12px; color: #6f7689; margin-top: 8px; }
  .ok { color: #4ade80; } .err { color: #f87171; }
  .seats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .seat { background: #11161f; border: 1px solid #2a3045; border-radius: 12px; padding: 12px 6px; text-align: center; cursor: pointer; transition: .15s; }
  .seat:hover { border-color: #4f6bff; }
  .seat.mine { border-color: #4ade80; background: #162b1f; }
  .seat.taken { border-color: #f59e0b; }
  .seat .idx { font-size: 12px; color: #8a90a2; }
  .seat .name { font-size: 13px; margin-top: 4px; word-break: break-all; }
  .room-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .room-list { display: flex; flex-direction: column; gap: 8px; }
  .room-item { display: flex; justify-content: space-between; align-items: center; background: #11161f; border: 1px solid #2a3045; border-radius: 10px; padding: 12px 14px; cursor: pointer; }
  .room-item:hover { border-color: #4f6bff; }
  .log { max-height: 150px; overflow: auto; font-size: 12px; color: #9aa; background: #0c1019; border-radius: 9px; padding: 10px; margin-top: 10px; }
  .hidden { display: none; }
  audio { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>即构语聊房</h1>
  <div class="sub">15 麦位 · 手机号验证码登录 · 开发模式验证码自动填入</div>

  <!-- 登录 -->
  <div class="card" id="loginBox">
    <div class="row">
      <div class="grow">
        <label>手机号</label>
        <input id="phone" placeholder="请输入11位手机号" maxlength="11">
      </div>
      <div style="width:150px;">
        <label>&nbsp;</label>
        <button class="btn-primary" id="btnSms" style="width:100%;">获取验证码</button>
      </div>
    </div>
    <div style="margin-top:12px;">
      <label>验证码</label>
      <input id="code" placeholder="6位验证码（开发模式自动填入）" maxlength="6">
    </div>
    <button class="btn-primary btn-block" id="btnLogin">登录</button>
    <div class="hint" id="loginHint">提示：点击"获取验证码"后，验证码会自动填入输入框。</div>
  </div>

  <!-- 房间大厅 -->
  <div class="card hidden" id="roomBox">
    <div class="room-bar">
      <div>
        <div>当前用户：<span id="curUser" class="ok"></span></div>
        <div class="hint">UID: <span id="curUid"></span></div>
      </div>
      <button class="btn-ghost" id="btnLogout">退出登录</button>
    </div>
    <div class="row">
      <div class="grow">
        <label>创建 / 加入房间</label>
        <input id="roomInput" placeholder="输入房间ID，如 1001">
      </div>
      <div style="width:140px;">
        <label>&nbsp;</label>
        <button class="btn-primary" id="btnCreate" style="width:100%;">创建 / 加入</button>
      </div>
    </div>
    <div style="margin-top:14px; font-weight:600; font-size:14px;">房间大厅</div>
    <div class="room-list" id="roomList"></div>
  </div>

  <!-- 语聊房（15麦位） -->
  <div class="card hidden" id="chatBox">
    <div class="room-bar">
      <div>
        <div>房间：<span id="curRoom" class="ok"></span></div>
        <div class="hint" id="roomInfo">房主：— · 麦位占用 0/15</div>
      </div>
      <button class="btn-ghost" id="btnLeave">离开房间</button>
    </div>
    <div class="seats" id="seats"></div>
    <div class="log" id="log"></div>
    <audio id="audioEl" autoplay playsinline></audio>
  </div>
</div>

<script src="https://unpkg.com/zego-express-engine-webrtc@3.10.1/index.js"></script>
<script src="https://unpkg.com/zego-zim-web@2.15.0/index.js"></script>
<script>
const CONFIG = { appId: 1183388233, rtcServer: 'wss://rtc.zego.im', zimServer: 'wss://accesshub-wss.zego.im' };
const $ = (id) => document.getElementById(id);
const log = (m) => { const el = $('log'); if(!el) return; el.innerHTML += '<div>' + new Date().toLocaleTimeString() + ' ' + m + '</div>'; el.scrollTop = el.scrollHeight; };
const API = ''; // 同域，Worker 托管前端

// ---- 状态 ----
let tokenData = null; // {uid,userName,token,appId,rtcServer,zimServer}
let zg = null, zim = null, mediaStream = null, myStreamId = null, mySeat = -1;
const SEAT_TOTAL = 15;

// ---- 验证码倒计时 ----
$('btnSms').addEventListener('click', async () => {
  const phone = $('phone').value.trim();
  if (!/^1\d{10}$/.test(phone)) { $('loginHint').innerHTML = '<span class="err">请输入正确的11位手机号</span>'; return; }
  const btn = $('btnSms'); btn.disabled = true; btn.textContent = '发送中...';
  try {
    const res = await fetch(API + '/api/sms', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ phone }) });
    const data = await res.json();
    if (data.ok) {
      if (data.devCode) $('code').value = data.devCode;
      let sec = 60; btn.textContent = sec + 's后重试';
      const t = setInterval(() => { sec--; if (sec<=0) { clearInterval(t); btn.disabled=false; btn.textContent='获取验证码'; } else btn.textContent=sec+'s后重试'; }, 1000);
      $('loginHint').innerHTML = '<span class="ok">' + (data.msg||'验证码已发送') + '</span>';
    } else { $('loginHint').innerHTML = '<span class="err">' + (data.msg||'发送失败') + '</span>'; btn.disabled=false; btn.textContent='获取验证码'; }
  } catch(e) { $('loginHint').innerHTML = '<span class="err">请求失败：' + e.message + '</span>'; btn.disabled=false; btn.textContent='获取验证码'; }
});

// ---- 登录 ----
$('btnLogin').addEventListener('click', async () => {
  const phone = $('phone').value.trim(), code = $('code').value.trim();
  if (!phone || !code) { $('loginHint').innerHTML = '<span class="err">请输入手机号和验证码</span>'; return; }
  const res = await fetch(API + '/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ phone, code, roomId:'default' }) });
  const data = await res.json();
  if (!data.ok) { $('loginHint').innerHTML = '<span class="err">' + (data.msg||'登录失败') + '</span>'; return; }
  tokenData = { ...data, appId: data.appId || CONFIG.appId, rtcServer: data.rtcServer || CONFIG.rtcServer, zimServer: data.zimServer || CONFIG.zimServer }; localStorage.setItem('zego_user', JSON.stringify(tokenData));
  $('curUser').textContent = data.userName; $('curUid').textContent = data.uid;
  $('loginBox').classList.add('hidden'); $('roomBox').classList.remove('hidden');
  log('登录成功，进入房间大厅'); loadRooms();
});

// ---- 房间大厅 ----
async function loadRooms() {
  const res = await fetch(API + '/api/rooms'); const data = await res.json();
  const list = (data.rooms || []).slice().sort((a,b)=>b.createdAt-a.createdAt);
  $('roomList').innerHTML = list.length ? list.map(r => '<div class="room-item" data-rid="'+r.roomId+'"><div><div>'+r.name+'</div><div class="hint">'+r.roomId+'</div></div><div class="hint">点击进入</div></div>').join('')
    : '<div class="hint">暂无房间，输入房间ID创建第一个房间吧</div>';
  document.querySelectorAll('.room-item').forEach(el => el.addEventListener('click', () => enterRoom(el.dataset.rid)));
}
$('btnCreate').addEventListener('click', async () => {
  const rid = $('roomInput').value.trim() || String(Date.now()).slice(-6);
  await fetch(API + '/api/rooms', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ roomId:rid, name:'房间'+rid, ownerUid:tokenData.uid }) });
  log('创建/加入房间：' + rid); enterRoom(rid);
});
$('btnLogout').addEventListener('click', () => { localStorage.removeItem('zego_user'); location.reload(); });

// ---- 进入语聊房 ----
async function enterRoom(roomId) {
  if (!tokenData) return;
  $('roomBox').classList.add('hidden'); $('chatBox').classList.remove('hidden');
  $('curRoom').textContent = roomId; $('roomInfo').textContent = '房主：— · 麦位占用 0/15';
  renderSeats([]);
  try {
    await initRTC(roomId); await initZIM(roomId);
  } catch(e) { log('<span class="err">进房失败：'+e.message+'</span>'); }
}
function renderSeats(seats) {
  let html = '';
  for (let i=0;i<SEAT_TOTAL;i++) {
    const s = seats[i] || null; const cls = (i===mySeat)?'seat mine':(s?'seat taken':'seat');
    html += '<div class="'+cls+'" data-i="'+i+'"><div class="idx">麦位 '+i+'</div><div class="name">'+(s?s.name:'空')+'</div></div>';
  }
  $('seats').innerHTML = html;
  document.querySelectorAll('.seat').forEach(el => el.addEventListener('click', () => onSeatClick(Number(el.dataset.i))));
  const taken = seats.filter(Boolean).length; $('roomInfo').textContent = '房主：— · 麦位占用 '+taken+'/'+SEAT_TOTAL;
}
async function onSeatClick(i) {
  if (i===mySeat) { await leaveSeat(); return; }
  // 尝试占座
  const attr = {}; attr['seat'+i] = JSON.stringify({ uid:tokenData.uid, name:tokenData.userName });
  try { await zim.setRoomAttributes(attr, $('curRoom').textContent, { isForce:false }); log('抢麦位 '+i+' 成功'); }
  catch(e) { log('<span class="err">麦位 '+i+' 被占，抢座失败</span>'); }
}

// ---- RTC ----
async function initRTC(roomId) {
  if (typeof ZegoExpressEngine === 'undefined') { log('<span class="err">RTC SDK 加载失败</span>'); return; }
  zg = new ZegoExpressEngine(tokenData.appId, tokenData.rtcServer || '');
  zg.on('roomStreamUpdate', (rid, updateType, streamList) => {
    streamList.forEach(s => { if(updateType==='ADD') { log('远端流：'+s.streamID); zg.startPlayingStream(s.streamID, $('audioEl')); } else zg.stopPlayingStream(s.streamID); });
  });
  await zg.loginRoom(roomId, tokenData.token, { userID: tokenData.uid, userName: tokenData.userName });
  log('RTC 已进入房间 ' + roomId);
}
async function publishMySeat(i) {
  if (myStreamId) return;
  const streamID = 'room_'+$('curRoom').textContent+'_seat'+i+'_'+tokenData.uid;
  mediaStream = await zg.createStream({ audio:true }); $('audioEl').srcObject = mediaStream;
  await zg.startPublishingStream(streamID, mediaStream); myStreamId = streamID; mySeat = i;
  log('开始推流：'+streamID);
}
async function leaveSeat() {
  if (!myStreamId) return;
  try { await zim.deleteRoomAttributes(['seat'+mySeat], $('curRoom').textContent, { isForce:false }); } catch{}
  await zg.stopPublishingStream(myStreamId); if(mediaStream){ zg.destroyStream(mediaStream); mediaStream=null; } myStreamId=null; mySeat=-1; log('已下麦');
}

// ---- ZIM ----
async function initZIM(roomId) {
  if (typeof ZIM === 'undefined') { log('<span class="err">ZIM SDK 加载失败</span>'); return; }
  zim = ZIM.create({ appID: tokenData.appId, server: tokenData.zimServer || '' });
  zim.on('roomAttributesUpdated', (zim, { infos }) => {
    const seats = []; for (let i=0;i<SEAT_TOTAL;i++) seats.push(null);
    infos.forEach(info => { if(info.action===0||info.action===1){ Object.keys(info.roomAttributes).forEach(k=>{ if(k.indexOf('seat')===0){ const idx=Number(k.replace('seat','')); try{ seats[idx]=JSON.parse(info.roomAttributes[k]); }catch{} } }); } });
    renderSeats(seats);
  });
  await zim.login({ userID: tokenData.uid, userName: tokenData.userName }, tokenData.token);
  await zim.enterRoom(roomId); log('ZIM 已进入房间 ' + roomId);
  // 拉一次当前麦位
  const r = await zim.queryRoomAllAttributes(roomId); const seats=[]; for(let i=0;i<SEAT_TOTAL;i++) seats.push(null);
  if (r && r.roomAttributes) { Object.keys(r.roomAttributes).forEach(k=>{ if(k.indexOf('seat')===0){ const idx=Number(k.replace('seat','')); try{ seats[idx]=JSON.parse(r.roomAttributes[k]); }catch{} } }); }
  renderSeats(seats);
  // 占座成功后补推流（监听属性回调：若自己出现在某麦位则推流）
  const _orig = zim.on.bind(zim); zim.on('roomAttributesUpdated', (zim, { infos }) => {
    infos.forEach(info=>{ Object.keys(info.roomAttributes||{}).forEach(k=>{ if(k.indexOf('seat')===0){ const idx=Number(k.replace('seat','')); try{ const v=JSON.parse(info.roomAttributes[k]); if(v&&v.uid===tokenData.uid&&mySeat!==idx){ publishMySeat(idx); } }catch{} } }); });
  });
}

// 离开
$('btnLeave').addEventListener('click', async () => {
  await leaveSeat(); try{ await zg.logoutRoom($('curRoom').textContent); }catch{} try{ await zim.leaveRoom($('curRoom').textContent); }catch{} zg=null; zim=null;
  $('chatBox').classList.add('hidden'); $('roomBox').classList.remove('hidden'); loadRooms();
});

// 自动恢复登录态
(function(){ try{ const d=JSON.parse(localStorage.getItem('zego_user')); if(d&&d.token){ tokenData=d; $('curUser').textContent=d.userName; $('curUid').textContent=d.uid; $('loginBox').classList.add('hidden'); $('roomBox').classList.remove('hidden'); loadRooms(); } }catch{} })();
</script>
</body>
</html>
