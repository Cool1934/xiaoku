name = "zego-voice-room"
main = "worker.js"
compatibility_date = "2024-06-01"

kv_namespaces = [
  { binding = "KV", id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID" }
]
# 即构秘钥通过 wrangler secret 注入（不写进仓库）：
#   wrangler secret put APP_ID          -> 1183388233
#   wrangler secret put SERVER_SECRET   -> 你的 32 位 ServerSecret
